name: Sync UI Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/ui/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      TARGET_REPO_URL: https://x-access-token:${{ secrets.UI_REPO_PAT }}@github.com/vorhdam/ui.git
      TARGET_DIR: ui_repo

    steps:
      - name: Checkout source monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify PAT is present
        run: |
          if [ -z "${{ secrets.UI_REPO_PAT }}" ]; then
            echo "Error: UI_REPO_PAT secret is empty or missing!"
            exit 1
          fi

      - name: Clone or initialize target repo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$TARGET_DIR"

          git clone "$TARGET_REPO_URL" "$TARGET_DIR" || {
            mkdir -p "$TARGET_DIR"
            git init "$TARGET_DIR"
            git -C "$TARGET_DIR" remote add origin "$TARGET_REPO_URL"
          }

          git -C "$TARGET_DIR" config user.name "github-actions[bot]"
          git -C "$TARGET_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$TARGET_DIR" remote set-url origin "$TARGET_REPO_URL"

          if git -C "$TARGET_DIR" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "$TARGET_DIR" checkout main || git -C "$TARGET_DIR" checkout -B main
          else
            git -C "$TARGET_DIR" checkout -B main
          fi

      - name: Update target repo contents
        shell: bash
        run: |
          set -euo pipefail

          find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          if [ -d ".github/ui" ]; then
            cp -R .github/ui/. "$TARGET_DIR"/
          fi

          mkdir -p "$TARGET_DIR/apps" "$TARGET_DIR/packages"

          cp -R apps/ui "$TARGET_DIR/apps/" 2>/dev/null || true
          cp -R packages/color "$TARGET_DIR/packages/" 2>/dev/null || true
          cp -R packages/flags "$TARGET_DIR/packages/" 2>/dev/null || true
          cp -R packages/theme "$TARGET_DIR/packages/" 2>/dev/null || true

      - name: Commit and push to UI repository
        shell: bash
        run: |
          set -euo pipefail

          cd "$TARGET_DIR"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "Synced latest code from private monorepo [skip ci]"

          git push origin HEAD:main --force-with-lease
