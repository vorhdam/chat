name: Sync UI Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/ui/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone UI Repository
        env:
          PAT: ${{ secrets.UI_REPO_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "Error: UI_REPO_PAT secret is empty or missing!"
            exit 1
          fi

          git clone https://x-access-token:${PAT}@github.com/vorhdam/ui.git ui_repo

      - name: Update Files and Folders
        run: |
          find ui_repo -mindepth 1 -not -name '.git' -exec rm -rf {} +

          if [ -d ".github/ui" ]; then
            cp -r .github/ui/. ui_repo/
          fi

          mkdir -p ui_repo/apps

          cp -r apps/ui ui_repo/apps/
          cp -r packages/color ui_repo/packages/
          cp -r packages/flags ui_repo/packages/
          cp -r packages/theme ui_repo/packages/

      - name: Commit and Push to UI Repository
        env:
          PAT: ${{ secrets.UI_REPO_PAT }}
        run: |
          cd ui_repo

          git remote set-url origin https://x-access-token:${PAT}@github.com/vorhdam/ui.git
          git add -A

          if git diff-index --quiet HEAD; then
            echo "No changes to sync."
          else
            git commit -m "Synced latest code from private monorepo [skip ci]"
            git push origin main --force
          fi
